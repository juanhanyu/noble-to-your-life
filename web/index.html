<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f6f0">
<meta name="description" content="言有出处：输入日常话，找到真实经文原句与出处。本地检索，不上传搜索词。">
<title>言有出处 · 日常聊天，句句有来头</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="workspace">
  <div class="row masthead"><div class="brand"><img src="assets/icon.png" alt="言有出处"><span>言有出处</span><span class="tagline">可是我觉得很神圣啊</span></div><span class="link small" id="aboutBtn">关于</span></div>
  <div class="row input-heading"><span>你想说什么？</span><div class="input-actions"><span class="link" id="pasteBtn">粘贴</span><span class="muted" id="clearBtn">清空</span></div></div>
  <div class="search-box"><input id="query" value="" maxlength="120" placeholder="输入日常话，寻找真实原句" autocomplete="off"><button class="primary" id="searchBtn" type="button">查询</button></div>
  <div class="examples" id="examplesBox"></div>
  <div class="row filters"><div class="tabs"><span class="active" id="modeSmart" data-mode="smart">相近表达</span><span id="modeExact" data-mode="exact">原文包含</span></div><div class="picker"><select id="editionSelect" aria-label="选择译本"></select></div></div>
  <div class="row results-heading"><span id="resultsTitle">查询结果</span><div><span class="muted status" id="statusText"></span><span class="link" id="favToggle">收藏</span></div></div>
  <div class="result-list" id="resultList"></div>
  <div class="copy-panel"><div class="preview placeholder" id="preview">选中原句后，在这里一键复制原句与出处</div><div class="copy-actions"><button class="primary copy-button" id="copyBtn" type="button" disabled>复制原句与出处</button><button class="secondary" id="favBtn" type="button" disabled>收藏</button><button class="secondary settings-button" id="settingsBtn" type="button">格式</button></div><div class="footnote">原文摘录 · 不生成经文 · 请结合上下文</div></div>
  <div class="overlay" id="overlay" hidden><div class="settings" id="settingsBox"><div class="row"><span>引用格式</span><span class="link" id="settingsClose">完成</span></div><div class="row option"><span>引用完整经节</span><input type="checkbox" class="switch" id="wholeSwitch" aria-label="引用完整经节"></div><div class="row option"><span>附上译本名称</span><input type="checkbox" class="switch" id="versionSwitch" aria-label="附上译本名称"></div><input type="text" id="templateInput" maxlength="200"><div class="muted">可用：{text} {book} {chapter} {verse} {version}</div><div class="row settings-footer"><span class="link" id="resetTpl">恢复默认</span><button class="share" id="shareBtn" type="button">分享这个小玩具 ↗</button></div></div></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
